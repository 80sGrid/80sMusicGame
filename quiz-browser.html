
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>80sMusicGame Quiz Browser</title>
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@700;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: linear-gradient(135deg, #667eea, #764ba2); min-height: 100vh; padding: 30px 20px; }
h1 { font-family: "Oxanium", sans-serif; color: white; text-align: center; font-size: 2em; letter-spacing: 3px; margin-bottom: 6px; }
p { text-align: center; color: rgba(255,255,255,0.7); font-size: 0.85em; margin-bottom: 20px; }
.filters { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
.filter-btn { padding: 8px 20px; border: 2px solid rgba(255,255,255,0.5); background: transparent; color: white; border-radius: 20px; cursor: pointer; font-size: 0.85em; font-weight: bold; transition: all 0.2s; }
.filter-btn:hover, .filter-btn.active { background: white; color: #667eea; border-color: white; }
.count { text-align: center; color: rgba(255,255,255,0.6); font-size: 0.8em; margin-bottom: 16px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; max-width: 1100px; margin: 0 auto; }
.quiz-card { background: white; border-radius: 12px; padding: 14px; cursor: pointer; text-decoration: none; color: inherit; display: block; transition: transform 0.15s, box-shadow 0.15s; border-top: 4px solid #ccc; }
.quiz-card:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0,0,0,0.25); }
.quiz-card.easy   { border-top-color: #28a745; }
.quiz-card.medium { border-top-color: #fd7e14; }
.quiz-card.hard   { border-top-color: #dc3545; }
.quiz-num { font-family: "Oxanium", sans-serif; font-size: 1em; font-weight: 900; color: #8B00FF; margin-bottom: 4px; }
.quiz-title { font-size: 0.82em; font-weight: 700; color: #333; margin-bottom: 6px; line-height: 1.3; }
.quiz-artists { font-size: 0.7em; color: #888; line-height: 1.4; }
.badge { display: inline-block; font-size: 0.62em; font-weight: 900; padding: 2px 8px; border-radius: 10px; margin-top: 6px; text-transform: uppercase; letter-spacing: 1px; }
.easy .badge   { background: #d4edda; color: #155724; }
.medium .badge { background: #fff3cd; color: #856404; }
.hard .badge   { background: #f8d7da; color: #721c24; }
</style>
</head>
<body>
<h1>🎸 80sMusicGame Quiz Browser</h1>
<p>All 70 quizzes — click any card to play</p>
<div class="filters">
  <button class="filter-btn active" onclick="setFilter('all', this)">All (90)</button>
  <button class="filter-btn" onclick="setFilter('easy', this)">🟢 Easy</button>
  <button class="filter-btn" onclick="setFilter('medium', this)">🟠 Medium</button>
  <button class="filter-btn" onclick="setFilter('hard', this)">🔴 Hard</button>
</div>
<div class="count" id="count"></div>
<div class="grid" id="grid"></div>

<script>
/* ============================================================
   80sMusicGame.com — Internal Quiz Browser
   Loads quiz-data.js (the SAME source the game uses), so it always
   reflects the live quiz set and can never drift out of sync.
   ============================================================ */
</script>
<script>function quizInit(){}</script>   <!-- stub: quiz-data.js calls the game's quizInit() -->
<script src="quiz-data.js"></script>
<script>

function getQuizByNum(n)     { return window.QUIZ_DATA.find(q => q.n === n) || null; }
function getQuizByFile(f)    { return window.QUIZ_DATA.find(q => q.f === f) || null; }
function getQuizzesByDiff(d) { return window.QUIZ_DATA.filter(q => q.d === d); }
function getRandomQuiz(d)    { const p=d?getQuizzesByDiff(d):window.QUIZ_DATA; return p[Math.floor(Math.random()*p.length)]; }
function buildEmojiGrid(s)   { const m={correct:'🟩',incorrect:'🟥',lifeline:'🟨',empty:'⬜'}; return [0,1,2].map(r=>[0,1,2].map(c=>m[s[r*3+c]]||'⬜').join('')).join('\n'); }

window.ALL_NAV_QUIZZES = window.QUIZ_DATA.map(q => ({ n: q.n, f: q.f, c: q.d }));


function setFilter(d, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderGrid(d);
}

function renderGrid(d) {
  const data = window.QUIZ_DATA || [];
  const filtered = d === 'all' ? data : data.filter(q => q.d === d);
  document.getElementById('count').textContent = 'Showing ' + filtered.length + ' quizzes';
  document.getElementById('grid').innerHTML = filtered.map(q =>
    '<a class="quiz-card ' + q.d + '" href="index.html?id=' + q.n + '">' +
    '<div class="quiz-num">#' + String(q.n).padStart(3,'0') + '</div>' +
    '<div class="quiz-title">' + q.t + '</div>' +
    '<div class="quiz-artists">' + q.a.join(' · ') + '</div>' +
    '<span class="badge">' + q.d + '</span>' +
    '</a>'
  ).join('');
}

renderGrid('all');
</script>
</body>
</html>
